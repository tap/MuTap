name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            werror: ON
            capi: ON
            fingerprint_leg: linux-gcc
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            werror: ON
            capi: ON
            fingerprint_leg: linux-clang
          # macOS gates on the float32 backend MuTap actually uses, which is
          # the SPLIT-RADIX engine (DspTap's bit-identical C++20 port of Ooura's
          # rdft) — the root CMakeLists turns DspTap's Apple vDSP default back
          # off, with the measurements behind that decision recorded there and
          # in docs/itu-compliance.md (tap/MuTap#31). No flag needed here: the
          # gate follows the product's default rather than overriding it, so
          # this leg cannot drift away from what ships.
          - name: macOS AppleClang
            os: macos-latest
            werror: ON
            capi: ON
            fingerprint_leg: macos-appleclang
          # Warnings stay non-fatal on MSVC until /W4 output has been triaged
          # on a Windows runner (same policy as the sibling *Tap repos).
          # capi stays OFF on Windows: tools/capi carries no __declspec(dllexport)
          # (unlike DspTap's), so an MSVC build would link a DLL exporting nothing
          # — it would pass without gating anything. Turn this ON in the same
          # change that gives the C ABI an export decoration.
          - name: Windows MSVC
            os: windows-latest
            werror: OFF
            capi: OFF
            fingerprint_leg: windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # Chip identity matters on Apple: #31's draw was observed on an M1 VM
      # and does NOT reproduce on Intel, so a bare "macOS" label is not enough
      # to attribute a past result.
      - name: Record host identity (macOS)
        if: runner.os == 'macOS'
        run: |
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.model
          sw_vers
          cc --version | head -2

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMUTAP_WERROR=${{ matrix.werror }}
          -DMUTAP_BUILD_CAPI=${{ matrix.capi }}
          -DMUTAP_FINGERPRINT_LEG=${{ matrix.fingerprint_leg }}

      # Record the backend actually built, so a log can never be misread about
      # which float32 configuration produced its numbers.
      - name: Record float32 FFT backend
        if: runner.os == 'macOS'
        run: grep '^TAP_DSP_FFT_ACCELERATE' build/CMakeCache.txt || echo 'TAP_DSP_FFT_ACCELERATE not in cache (default)'

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The bit-identity gate (tests/fingerprint_harness.cpp) already ran as a
      # test above against this leg's committed lines
      # (tests/fingerprints/<fingerprint_leg>.txt); a difference failed the
      # Test step with the diff and the re-recording pointer in its output.
      # Run it once more verbosely so a green log carries the lines too, and
      # assert the verdict names this leg: a leg whose id is not wired would
      # otherwise compare nothing and pass.
      - name: Fingerprints
        shell: bash
        run: |
          set -eo pipefail
          ctest --test-dir build -C Release -R '^mutap_fingerprint$' -V | tee fingerprints.log
          grep -q 'FINGERPRINT_PASS leg=${{ matrix.fingerprint_leg }} ' fingerprints.log

      # These three rows were the per-process bifurcation in #31. Now that the
      # alignment fix has removed the draw, repeating them says something
      # different but still worth recording: whether the remaining failures are
      # STABLE. A row that fails 20/20 is a deterministic property of the
      # backend difference; one that still wanders means a second source of
      # variation survives and the diagnosis is incomplete.
      #
      # always(), because the whole point is to characterize a failure — and a
      # failing Test step above would otherwise skip it, which is exactly what
      # happened on the first run that needed it.
      - name: Repeat the float32 rows (stability, not a draw)
        if: always() && runner.os == 'macOS'
        run: >
          ctest --test-dir build -C Release --output-on-failure
          --repeat until-fail:20
          -R 'itu_echo\.EchoStability<float>|g168_adapted\.ToneStability<float>|Float32Parity\.ToneRowWithNarrowbandGuard'

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DMUTAP_FINGERPRINT_LEG=linux-asan-ubsan

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      # The Test step above ran the fingerprint gate against
      # tests/fingerprints/linux-asan-ubsan.txt; assert it ran for this leg.
      - name: Fingerprints
        run: |
          set -eo pipefail
          ctest --test-dir build -R '^mutap_fingerprint$' -V | tee /tmp/fp-asan.log
          grep -q 'FINGERPRINT_PASS leg=linux-asan-ubsan ' /tmp/fp-asan.log

  # Cross-compile for Arm Cortex-M55 (bare metal, newlib + semihosting) and
  # run the emulation-sized test subset on QEMU's MPS3 AN547 board model:
  # the float32 embedded profile the one-core/three-targets plan exists for,
  # on a 32-bit MCU-class target with no OS, no threads and no
  # double-precision FPU, including the float-tracks-double oracle check
  # and the PEM canceller's float closed-loop headline scenario. Platform
  # rig (startup, linker script, one-shot gtest harness) ported from
  # SampleRateTap.
  cortex-m55-qemu:
    name: Cortex-M55 cross (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install toolchain and QEMU
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q gcc-arm-none-eabi qemu-system-arm

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m55-mps3.cmake
          -DMUTAP_FINGERPRINT_LEG=m55-cmsis

      - name: Build
        run: cmake --build build -j 4

      # The default leg above builds DspTap's CMSIS-DSP Helium FFT backend,
      # which is ON by default on the bare-metal M55 profile (TAP_DSP_FFT_CMSIS,
      # docs/optimization.md) — so ctest exercises the vendored
      # submodules/dsptap/third_party/cmsis-dsp subset and its Ooura-contract
      # reconciliation on the full emulated battery.
      # The battery leaves the fingerprint harness out (-E): ctest hides a
      # passing test's output, so the harness runs once, verbosely, in the
      # next step instead: the gate against tests/fingerprints/m55-cmsis.txt
      # (a difference fails the step with the diff), and the log carries the
      # on-target FINGERPRINT lines for this backend. The harness prints the
      # backend it was compiled with; asserting it is the positive proof of
      # which backend ran, and asserting the verdict names this leg proves the
      # comparison ran.
      - name: Test under emulation (CMSIS Helium FFT — default)
        run: ctest --test-dir build --output-on-failure -E '^mutap_fingerprint$'

      - name: Fingerprints (CMSIS Helium FFT)
        run: |
          set -eo pipefail
          ctest --test-dir build -R '^mutap_fingerprint$' -V | tee /tmp/fp-cmsis.log
          grep -q 'backend=cmsis abi=fft_cmsis' /tmp/fp-cmsis.log
          grep -q 'FINGERPRINT_PASS leg=m55-cmsis ' /tmp/fp-cmsis.log

      # Second leg keeps the split-radix float32 fallback alive (DspTap's C++20
      # port of Ooura's rdft; the "Ooura" leg in logs up to DspTap 8350f13):
      # same emulated battery with DspTap's backend option forced OFF. The option was renamed from
      # MUTAP_FFT_CMSIS to TAP_DSP_FFT_CMSIS when the FFT moved to DspTap
      # (14116f0); this leg kept the old name, which CMake ignored, so from that
      # commit until #50 it rebuilt CMSIS and the scalar-float32-on-M55 profile
      # had no coverage. Guards: the configure log must not select CMSIS, the
      # cache entry must be the typed :BOOL=OFF (an unknown -D lands as
      # :UNINITIALIZED, so a future rename fails here instead of silently
      # rebuilding CMSIS), and the Fingerprints step below asserts the backend
      # the binary that ran was actually compiled with.
      - name: Configure (split-radix FFT fallback)
        run: |
          set -eo pipefail
          cmake -B build-split-radix \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m55-mps3.cmake \
            -DTAP_DSP_FFT_CMSIS=OFF \
            -DMUTAP_FINGERPRINT_LEG=m55-split-radix | tee /tmp/configure-split-radix.log
          if grep -q 'float32 FFT backend = CMSIS' /tmp/configure-split-radix.log; then
            echo "::error::the split-radix fallback leg configured the CMSIS backend"; exit 1
          fi
          grep '^TAP_DSP_FFT_CMSIS:BOOL=OFF' build-split-radix/CMakeCache.txt

      - name: Build (split-radix FFT fallback)
        run: cmake --build build-split-radix -j 4

      - name: Test under emulation (split-radix FFT fallback)
        run: ctest --test-dir build-split-radix --output-on-failure -E '^mutap_fingerprint$'

      - name: Fingerprints (split-radix FFT fallback)
        run: |
          set -eo pipefail
          ctest --test-dir build-split-radix -R '^mutap_fingerprint$' -V | tee /tmp/fp-split-radix.log
          grep -q 'backend=split_radix abi=fft_split_radix' /tmp/fp-split-radix.log
          grep -q 'FINGERPRINT_PASS leg=m55-split-radix ' /tmp/fp-split-radix.log

  # Cortex-M33 (Raspberry Pi Pico 2 W / RP2350 class: single-precision FPU,
  # no FP64, no MVE) on QEMU's MPS2+ AN505 model — the wake-word plan's named
  # embedded target. Same Armv8-M startup as the M55 leg, split-radix float32 FFT
  # (no Helium here), the same float-profile selection as the M55 leg (about
  # 3 minutes of emulation once the speech predictor's pitch search stopped
  # accumulating in double — see tests/bare_metal_main.cpp). Ported from
  # RatioTap's cortex-m33-qemu job.
  cortex-m33-qemu:
    name: Cortex-M33 cross (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install toolchain and QEMU
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q gcc-arm-none-eabi qemu-system-arm

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m33-mps2.cmake
          -DMUTAP_FINGERPRINT_LEG=m33

      - name: Build
        run: cmake --build build -j 4

      - name: Test under emulation
        run: ctest --test-dir build --output-on-failure -E '^mutap_fingerprint$'

      # The toolchain file pins CMSIS off (no MVE); the harness must say so.
      # The gate compares against tests/fingerprints/m33.txt.
      - name: Fingerprints
        run: |
          set -eo pipefail
          ctest --test-dir build -R '^mutap_fingerprint$' -V | tee /tmp/fp-m33.log
          grep -q 'backend=split_radix abi=fft_split_radix' /tmp/fp-m33.log
          grep -q 'FINGERPRINT_PASS leg=m33 ' /tmp/fp-m33.log

  # Cross-compile for Qualcomm Hexagon (hexagon-unknown-linux-musl, HVX
  # auto-vectorization on) and run the FULL test suite under qemu-hexagon
  # user-mode emulation: the third target of the one-core/three-targets
  # plan. Unlike the M55 leg this is a hosted Linux target — stock gtest
  # main, ctest discovery and exit codes all work unchanged; binaries link
  # statically so the emulator needs no sysroot. The VTCM/FastRPC
  # data-layout work needs the proprietary Hexagon SDK and hardware; this
  # job pins down what is checkable without them: the LLVM Hexagon backend
  # compiles the core (including HVX vectorized loops) and every numeric
  # regression test passes on the target ISA.
  hexagon-qemu:
    name: Hexagon cross (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOOLCHAIN: clang+llvm-19.1.5-cross-hexagon-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install QEMU
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q qemu-user-static

      # The quic/toolchain_for_hexagon GitHub releases carry no assets of
      # their own — the release notes link to Codelinaro's artifactory,
      # which is where the archives actually live.
      - name: Download Hexagon toolchain
        run: >
          mkdir -p "$RUNNER_TEMP/hexagon-toolchain" &&
          curl -fsSL
          "https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/19.1.5/${TOOLCHAIN}.tar.zst"
          | tar --zstd -x -C "$RUNNER_TEMP/hexagon-toolchain"

      # The tarball's inner directory naming has varied across releases, so
      # find the driver and derive the root from it instead of hardcoding.
      - name: Locate toolchain root
        run: |
          ls "$RUNNER_TEMP/hexagon-toolchain"
          cxx=$(find "$RUNNER_TEMP/hexagon-toolchain" -maxdepth 5 \( -type f -o -type l \) \
                \( -name 'hexagon-unknown-linux-musl-clang++' -o -name 'clang++' \) | sort | head -1)
          test -n "$cxx" || { echo "no clang++ found in the toolchain archive"; exit 1; }
          root=$(dirname "$(dirname "$cxx")")
          echo "found driver: $cxx"
          ls "$root/bin" | head -40
          echo "HEXAGON_TOOLCHAIN_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/hexagon-linux-musl.cmake
          -DHEXAGON_TOOLCHAIN_ROOT="$HEXAGON_TOOLCHAIN_ROOT"
          -DMUTAP_FINGERPRINT_LEG=hexagon

      - name: Build
        run: cmake --build build -j 4

      - name: Test under emulation
        run: ctest --test-dir build --output-on-failure -E '^mutap_fingerprint$'

      # The gate compares against tests/fingerprints/hexagon.txt.
      - name: Fingerprints
        run: |
          set -eo pipefail
          ctest --test-dir build -R '^mutap_fingerprint$' -V | tee /tmp/fp-hexagon.log
          grep -q 'backend=split_radix abi=fft_split_radix' /tmp/fp-hexagon.log
          grep -q 'FINGERPRINT_PASS leg=hexagon ' /tmp/fp-hexagon.log

  # Keeps the benchmarks compiling and runnable; never a performance gate
  # (shared runners are noise — see bench/README.md).
  bench-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMUTAP_BUILD_BENCHMARKS=ON
          -DMUTAP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Run (smoke)
        run: ./build/bench/mutap_bench --benchmark_min_time=0.01s

  # The suppressor's pass-1 estimator has two bit-identical forms selected by
  # MUTAP_SUPPRESSOR_BRANCHLESS (branch-free on Arm Helium, branchy elsewhere;
  # see include/mutap/postfilter.h). No single build compiles both, so this job
  # compiles the fingerprint harness (tests/fingerprint_harness.cpp — the same
  # binary that gates DspTap pin bumps) once per macro value and diffs every
  # FINGERPRINT line — the guard that the two forms cannot drift apart. The
  # standalone compile has no leg, so the harness compares nothing here; the
  # committed-lines gate runs on every other leg that runs the harness.
  branchless-parity:
    name: Suppressor branch-free/branchy parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Compile both forms and diff the fingerprints
        run: |
          # GitHub's default run shell is `bash -e {0}` without pipefail, so
          # the pipes through tee below would mask a harness crash without it.
          set -eo pipefail
          # Header-only since DspTap Stage 2c (tap/DspTap#32): tap::dsp is a
          # pure INTERFACE target and no vendored C is compiled into what ships.
          for bl in 0 1; do
            g++ -std=c++20 -O2 -DMUTAP_SUPPRESSOR_BRANCHLESS=$bl -Iinclude -Isubmodules/dsptap/include \
              tests/fingerprint_harness.cpp -o /tmp/parity_$bl
            /tmp/parity_$bl | tee /tmp/out_$bl
          done
          # Only the FINGERPRINT lines are compared (the '#' header names the
          # form and differs by design); an empty run must not pass either.
          grep '^FINGERPRINT ' /tmp/out_0 > /tmp/fp_0
          grep '^FINGERPRINT ' /tmp/out_1 > /tmp/fp_1
          test "$(wc -l < /tmp/fp_0)" -ge 14
          test "$(wc -l < /tmp/fp_1)" -ge 14
          if ! diff /tmp/fp_0 /tmp/fp_1; then
            echo "::error::branchy and branch-free suppressor forms diverged (see diff above)"; exit 1
          fi
          echo "all $(wc -l < /tmp/fp_0) fingerprints identical across the two forms — bit-identical"

  # Deterministic instruction-count ratchet (bench/README.md). Unlike the
  # wall-clock bench these counts are noise-free under QEMU's TCG plugin, so
  # a hard two-sided gate (+-3%) is safe on shared runners. Baselines live
  # in bench/baselines.json and are seeded by running scripts/icount.py with
  # --update once per target (see bench/README.md); until a target is seeded
  # this job reports each scenario's count and fails with "NO BASELINE".
  icount-ratchet:
    name: Instruction-count ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Commit the tag pointed at when pinned (tags are movable; commit SHAs
      # are not); the header's digest is verified on download. This SHA is
      # QEMU v8.2.2, matching ubuntu-latest's qemu-system-arm (plugin API v2).
      QEMU_PLUGIN_HEADER_URL: https://raw.githubusercontent.com/qemu/qemu/11aa0b1ff115b86160c4d37e7c37e6a6b13b77ea/include/qemu/qemu-plugin.h
      QEMU_PLUGIN_HEADER_SHA256: "c53a2af163e80e3f4bc6c60dbdfc84003db329d757e37cd8a16a77e1d82606ff"
      # Neither Debian's nor CodeLinaro's qemu-hexagon enables TCG plugins, so
      # the Hexagon leg builds its own qemu-hexagon from this pinned release
      # (matching the plugin header version). Digest verified on download.
      QEMU_SRC_URL: https://download.qemu.org/qemu-8.2.2.tar.xz
      QEMU_SRC_SHA256: "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3"
      TOOLCHAIN: clang+llvm-19.1.5-cross-hexagon-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install toolchains and QEMU
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q gcc-arm-none-eabi qemu-system-arm
          libglib2.0-dev pkg-config ninja-build meson flex bison

      - name: Build counting plugin
        run: |
          curl -sfLo /tmp/qemu-plugin.h "$QEMU_PLUGIN_HEADER_URL"
          actual=$(sha256sum /tmp/qemu-plugin.h | cut -d' ' -f1)
          if [ "$actual" != "$QEMU_PLUGIN_HEADER_SHA256" ]; then
            echo "::error::qemu-plugin.h checksum mismatch"; exit 1
          fi
          gcc -shared -fPIC $(pkg-config --cflags glib-2.0) -I/tmp \
            -o /tmp/libinsncount.so tools/qemu_insn_plugin/insn_count.c

      # Release (-O3 -DNDEBUG, CMake's Release flags) M55 workloads, matching how baselines are recorded. No
      # -DTAP_DSP_FFT_CMSIS here: the M55 profile defaults it ON, so the ratchet
      # gates the deployed CMSIS-DSP Helium FFT (bench/baselines.json m55).
      - name: Build M55 workloads
        run: >
          cmake -B build-m55
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m55-mps3.cmake
          -DMUTAP_BUILD_TESTS=OFF
          -DMUTAP_BUILD_ICOUNT_BENCH=ON
          && cmake --build build-m55 -j 4

      # Each target's ratchet runs even if an earlier one failed (each
      # target's numbers are independent evidence, and a legitimate baseline
      # move should surface all at once, not one CI round-trip at a time).
      # The job still fails overall if any target regressed or is unseeded.
      - name: Ratchet M55
        if: ${{ !cancelled() }}
        run: >
          python3 scripts/icount.py --target m55
          --build-dir build-m55 --plugin /tmp/libinsncount.so

      # Release (-O3 -DNDEBUG) M33 workloads on the MPS2+ AN505 model: the Pico 2 W
      # class core, split-radix float32 FFT (the toolchain file pins CMSIS off —
      # no Helium). bench/baselines.json m33 was seeded from this exact
      # toolchain/QEMU pair (gcc-arm-none-eabi 13.2.rel1, QEMU 8.2.2).
      - name: Build M33 workloads
        if: ${{ !cancelled() }}
        run: >
          cmake -B build-m33
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m33-mps2.cmake
          -DMUTAP_BUILD_TESTS=OFF
          -DMUTAP_BUILD_ICOUNT_BENCH=ON
          && cmake --build build-m33 -j 4

      - name: Ratchet M33
        if: ${{ !cancelled() }}
        run: >
          python3 scripts/icount.py --target m33
          --build-dir build-m33 --plugin /tmp/libinsncount.so

      # qemu-system-arm's plugins cover M55; qemu-hexagon must be built with
      # --enable-plugins (linux-user only, ~4 min, cached thereafter).
      - name: Cache plugin-enabled qemu-hexagon
        if: ${{ !cancelled() }}
        id: qemu-hex
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/qemu-hexagon-plugins
          key: qemu-hexagon-plugins-${{ env.QEMU_SRC_SHA256 }}-1

      - name: Build plugin-enabled qemu-hexagon
        if: ${{ !cancelled() && steps.qemu-hex.outputs.cache-hit != 'true' }}
        run: |
          curl -sfLo /tmp/qemu-src.tar.xz "$QEMU_SRC_URL"
          actual=$(sha256sum /tmp/qemu-src.tar.xz | cut -d' ' -f1)
          if [ "$actual" != "$QEMU_SRC_SHA256" ]; then
            echo "::error::qemu source checksum mismatch"; exit 1
          fi
          tar -xJf /tmp/qemu-src.tar.xz -C /tmp
          cd /tmp/qemu-*/
          ./configure --target-list=hexagon-linux-user --enable-plugins \
            --disable-docs --disable-tools --disable-system
          ninja -C build qemu-hexagon
          mkdir -p ~/qemu-hexagon-plugins
          cp build/qemu-hexagon ~/qemu-hexagon-plugins/

      - name: Download Hexagon toolchain
        if: ${{ !cancelled() }}
        run: >
          mkdir -p "$RUNNER_TEMP/hexagon-toolchain" &&
          curl -fsSL
          "https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/19.1.5/${TOOLCHAIN}.tar.zst"
          | tar --zstd -x -C "$RUNNER_TEMP/hexagon-toolchain"

      - name: Locate toolchain root
        if: ${{ !cancelled() }}
        run: |
          cxx=$(find "$RUNNER_TEMP/hexagon-toolchain" -maxdepth 5 \( -type f -o -type l \) \
                \( -name 'hexagon-unknown-linux-musl-clang++' -o -name 'clang++' \) | sort | head -1)
          test -n "$cxx" || { echo "no clang++ found in the toolchain archive"; exit 1; }
          echo "HEXAGON_TOOLCHAIN_ROOT=$(dirname "$(dirname "$cxx")")" >> "$GITHUB_ENV"

      - name: Build Hexagon workloads
        if: ${{ !cancelled() }}
        run: >
          cmake -B build-hex
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/hexagon-linux-musl.cmake
          -DHEXAGON_TOOLCHAIN_ROOT="$HEXAGON_TOOLCHAIN_ROOT"
          -DMUTAP_BUILD_TESTS=OFF
          -DMUTAP_BUILD_ICOUNT_BENCH=ON
          && cmake --build build-hex -j 4

      - name: Ratchet Hexagon
        if: ${{ !cancelled() }}
        run: |
          export PATH="$HOME/qemu-hexagon-plugins:$PATH"
          # qemu-hexagon exits 1 here with or without plugin support (no guest
          # binary given), so probe by the error text, not the exit code.
          if qemu-hexagon -plugin help 2>&1 | grep -q "unknown option"; then
            echo "::error::built qemu-hexagon lacks plugin support"; exit 1
          fi
          python3 scripts/icount.py --target hexagon \
            --build-dir build-hex --plugin /tmp/libinsncount.so

  # Python <-> C++ parity of the learned suppressor (tools/ml/test_parity.py):
  # the C++ inference against the numpy reference, in BOTH numeric profiles,
  # on random weights at both trained geometries and on the shipping
  # pretrained model. Previously a hand-run script; a feature definition
  # drifting between features.py and nn_suppressor.h now fails here, not in
  # a quietly degraded model (wake-word plan, M2).
  nn-parity:
    name: Suppressor Python/C++ parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install numpy
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-numpy

      - name: Build the parity driver
        run: >
          cmake -B build-ml -DCMAKE_BUILD_TYPE=Release
          -DMUTAP_BUILD_TESTS=OFF -DMUTAP_BUILD_ML_TOOLS=ON
          && cmake --build build-ml -j 4 --target nn_infer

      - name: Parity, double profile
        run: |
          python3 tools/ml/test_parity.py --build-dir build-ml --profile double --geometry 16k
          python3 tools/ml/test_parity.py --build-dir build-ml --profile double --geometry 48k
          python3 tools/ml/test_parity.py --build-dir build-ml --profile double --weights tools/ml/pretrained/suppressor_v2_48k.munn

      - name: Parity, float profile
        run: |
          python3 tools/ml/test_parity.py --build-dir build-ml --profile float --geometry 16k
          python3 tools/ml/test_parity.py --build-dir build-ml --profile float --geometry 48k
          python3 tools/ml/test_parity.py --build-dir build-ml --profile float --weights tools/ml/pretrained/suppressor_v2_48k.munn

  # The wake-word dataset builder (tools/ml/kws, wake-word plan M4a). The
  # committed toy fixture rebuilds into an empty store and must reproduce
  # its committed lock's identity fields exactly and its features within the
  # pinned tolerance; a corrupted archive, an unverified archive, a planted
  # split leak (R1-R5), an unlicensed clip and a non-redistributable
  # in-repository source must each be refused by name. The front end is the
  # shipping one: kws_features drives DspTap's C ABI through dsptap_py, which
  # builds submodules/dsptap/build_capi with cmake on first import (cmake and
  # a C++ compiler are both on ubuntu-latest). numpy, scipy and soundfile
  # come pinned from tools/ml/kws/requirements.txt, never from apt, so the
  # resampler and decoder ids the lock records match the M0 Mac's.
  kws-dataset:
    name: Wake-word dataset builder (toy fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ml/kws/requirements.txt

      - name: Install the builder's pinned Python environment
        run: python -m pip install -r tools/ml/kws/requirements.txt

      # kws_features.ensure_bridge builds submodules/dsptap/build_capi (Release) and keys it to the
      # submodule commit with a .dsptap_commit marker, so the commit the lock and shard headers
      # record is the one the C ABI was compiled from; --ensure-bridge shows cmake's output, so a
      # compiler failure stays readable, and the import afterwards checks the bridge.
      - name: Build the DspTap C ABI bridge (kws_features --ensure-bridge), then import it
        run: |
          cmake --version
          python tools/ml/kws/kws_features.py --ensure-bridge
          python -c "import sys; sys.path.insert(0, 'tools/ml/kws'); import kws_features; print('log_mel contract version', kws_features.contract_version(), 'DspTap', kws_features.dsptap_commit())"

      - name: Dataset builder tests
        run: python -m unittest discover -s tools/ml/kws -p 'test_*.py' -v

  # The room-measurement tools (tools/fixtures). measure_rir.py (swept sine,
  # deconvolution, round-trip latency, T20/T30) is checked against a synthetic
  # loopback and synthetic rooms; howl_criterion.py (the offline howl
  # criterion of the real-room protocol) against a simulated acoustic loop in
  # nine rooms, dry and behind a canceller-like residual, with in-chain reverb.
  # No audio device: sounddevice is imported only by the live subcommands. The
  # shifter-in-the-loop oracle is ~10 min on 12 cores and runs locally only
  # (HOWL_SLOW=1). numpy, scipy and matplotlib come pinned from
  # tools/fixtures/requirements.txt, the versions the thresholds were measured with.
  fixture-tools:
    name: Room-measurement tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fixtures/requirements.txt

      - name: Install the tools' pinned Python environment
        run: python -m pip install -r tools/fixtures/requirements.txt

      - name: Room-measurement tool tests
        run: python -m unittest discover -s tools/fixtures -p 'test_*.py' -v

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      # Run the TapHouse pre-commit hook — the exact same pinned clang-format
      # developers get from `pre-commit install` (.pre-commit-config.yaml). CI
      # and local therefore share one clang-format version by construction, and
      # cover the same files (all C/C++ minus third_party and generated tables),
      # so a green local commit can't fail here. pipx is preinstalled on the
      # runner; the pinned hook is fetched and cached on first use.
      - name: Check formatting (pre-commit)
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      # The ABI-tag rule's one gap the compiler cannot see (include/mutap/fft.h,
      # HANDOFF.md working note 6): a forward declaration of a tagged class in
      # plain tap::mu declares a DIFFERENT class. A TU that also sees the
      # definition fails to compile (clang: ambiguous; g++: a parse error), but a header that
      # forward-declares and never includes the definition compiles and is an
      # ODR hazard across images. Include the header instead.
      - name: No forward declarations of the ABI-tagged classes
        run: |
          if git grep -nE '(^|[{;])\s*(template\s*<[^>]*>\s*)?(class|struct)\s+(partitioned_fdaf|partitioned_fdkf|pem_afc|residual_suppressor|nn_suppressor)\s*;' -- include tools tests bench; then
            echo "::error::forward declaration of an ABI-tagged class (see include/mutap/fft.h); include its header instead"; exit 1
          fi
          echo "no forward declarations of the five tagged classes"
